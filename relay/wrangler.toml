name = "local-commander"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[durable_objects]
bindings = [{ name = "RELAY", class_name = "Relay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[vars]
RELAY_ORIGIN = "https://local-commander.YOUR-SUBDOMAIN.workers.dev"
